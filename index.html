<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대학로 이벤트 카페</title>
<meta name="theme-color" content="#14161f">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161f;
    --bg-vignette: #0d0e15;
    --card: #f6efdd;
    --ink: #211c14;
    --ink-soft: #6b6152;
    --amber: #e2a13a;
    --amber-deep: #b97c1f;
    --velvet: #a83a45;
    --line: #cabf9c;
    --focus: #f2c069;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, #1c2030 0%, var(--bg) 55%, var(--bg-vignette) 100%);
    color: var(--card);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap{ max-width: 960px; margin: 0 auto; }

  .marquee{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom: 22px; border-bottom: 1px solid rgba(226,161,58,0.35); margin-bottom: 26px; }
  .marquee h1{ font-family:"Noto Serif KR", serif; font-weight:900; font-size: clamp(26px, 4vw, 38px); margin:0; letter-spacing: -0.01em; color: #f7ecd2; }
  .marquee p{ margin: 6px 0 0; color:#b9b2a0; font-size:14px; }

  .report-fab{ position: fixed; bottom: 22px; right: 22px; width: 56px; height: 56px; border-radius: 50%; background: var(--velvet); color: #fff2f2; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(168,58,69,0.45); z-index: 40; transition: transform .15s ease, box-shadow .15s ease; }
  .report-fab:hover{ transform: translateY(-2px) scale(1.05); box-shadow: 0 10px 26px rgba(168,58,69,0.55); }
  .report-fab:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }

  .controls{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 26px; }
  .search-box{ flex: 1 1 220px; display:flex; align-items:center; gap:8px; background: rgba(246,239,221,0.06); border: 1px solid rgba(246,239,221,0.18); border-radius: 10px; padding: 10px 14px; }

  .fav-toggle{ display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid rgba(246,239,221,0.2); color:#c9c2b0; padding:9px 14px; border-radius: 999px; font-size:13px; cursor:pointer; font-family:inherit; transition: all .15s ease; white-space:nowrap; }
  .fav-toggle.active{ background: rgba(226,161,58,0.16); border-color: var(--amber); color: #f2c069; font-weight:700; }
  .fav-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .date-filter-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .date-select{ background: rgba(246,239,221,0.06); border: 1px solid rgba(246,239,221,0.18); color:#f6efdd; border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; cursor:pointer; }
  .date-select:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .custom-date-input{ background: rgba(246,239,221,0.06); border: 1px solid rgba(246,239,221,0.18); color:#f6efdd; border-radius:10px; padding:8px 12px; font-size:13px; font-family:inherit; }

  .today-banner{ display:none; align-items:center; gap:8px; background: rgba(226,161,58,0.1); border:1px solid rgba(226,161,58,0.35); color:#f2c069; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:600; margin-bottom:16px; cursor:pointer; }
  .today-banner:hover{ background: rgba(226,161,58,0.18); }
  .today-banner.show{ display:flex; }

  .card-date-text{ font-size:11px; color: var(--ink-soft); margin-left:8px; font-weight:600; }

  .card-fav-badge{ position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; background:rgba(20,22,31,0.55); display:flex; align-items:center; justify-content:center; }

  .fav-btn{ position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; background:rgba(20,22,31,0.55); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5; }
  .fav-btn:hover{ background:rgba(20,22,31,0.75); }
  .fav-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .fav-toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px); max-width:min(90vw, 380px); background: var(--card); color: var(--ink); border-radius:12px; padding:14px 18px; box-shadow:0 14px 30px rgba(0,0,0,0.4); z-index:60; display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease; }
  .fav-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .fav-toast strong{ color: var(--velvet); }
  .search-box svg{ flex-shrink:0; opacity:.6; }
  .search-box input{ flex:1; background:transparent; border:none; color:#f6efdd; font-size:14px; outline:none; font-family: inherit; }
  .search-box input::placeholder{ color:#8a8272; }
  .tabs{ display:flex; gap:6px; }
  .tab{ background:transparent; border:1px solid rgba(246,239,221,0.2); color:#c9c2b0; padding:9px 14px; border-radius: 999px; font-size:13px; cursor:pointer; font-family:inherit; transition: all .15s ease; white-space:nowrap; }
  .tab.active{ background: rgba(226,161,58,0.16); border-color: var(--amber); color: #f2c069; font-weight:700; }
  .tab:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .ticket{ background: var(--card); color: var(--ink); border-radius: 14px; position: relative; box-shadow: 0 10px 24px rgba(0,0,0,0.35); overflow: hidden; display:flex; flex-direction: column; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .ticket:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,0.4); }
  .ticket-image{ width:100%; height:140px; background: linear-gradient(135deg, #2a2f45, #1c2030); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .ticket-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ticket-image .placeholder-icon{ color:#5c5546; opacity:.4; }
  .ticket-body-compact{ padding: 14px 16px 18px; }
  .ticket-body-compact h2{ font-family:"Noto Serif KR", serif; font-weight:800; font-size: 16px; margin: 8px 0 0; line-height:1.35; color: var(--ink); }
  .ticket-body{ padding: 18px 20px 16px; }
  .ticket-status{ display:inline-block; font-size:11px; font-weight:700; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .status-ongoing{ background: rgba(168,58,69,0.14); color: var(--velvet); }
  .status-upcoming{ background: rgba(226,161,58,0.18); color: var(--amber-deep); }
  .status-ended{ background: rgba(107,97,82,0.14); color: var(--ink-soft); }
  .ticket h2{ font-family:"Noto Serif KR", serif; font-weight:800; font-size: 19px; margin: 0 0 2px; line-height:1.3; }
  .ticket .actor{ font-size: 14px; color: var(--velvet); font-weight:700; margin: 0 0 12px; }
  .meta-row{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color: #423b2c; margin-bottom: 6px; line-height:1.45; }
  .meta-row svg{ flex-shrink:0; margin-top:2px; opacity:.65; }
  .memo{ margin-top:8px; font-size:12.5px; color: var(--ink-soft); line-height:1.5; }

  .perforation{ position:relative; height: 0; border-top: 2px dashed var(--line); margin: 4px 0 0; }
  .perforation::before, .perforation::after{ content:""; position:absolute; top:-9px; width:18px; height:18px; background: var(--bg); border-radius:50%; }
  .perforation::before{ left:-29px; }
  .perforation::after{ right:-29px; }

  .ticket-actions{ padding: 12px 20px 16px; display:flex; justify-content:flex-start; align-items:center; gap:10px; }
  .link-btn{ display:inline-flex; align-items:center; gap:7px; background: var(--ink); color: #f6efdd; text-decoration:none; font-size:13px; font-weight:600; padding: 8px 14px; border-radius: 8px; transition: background .15s ease; }
  .link-btn:hover{ background:#3a3123; }
  .link-btn.disabled{ background: rgba(33,28,20,0.12); color: var(--ink-soft); pointer-events:none; }

  .empty{ text-align:center; padding: 70px 20px; color:#a79f8c; border: 1px dashed rgba(246,239,221,0.2); border-radius: 16px; }
  .empty h3{ font-family:"Noto Serif KR", serif; color:#f0e6c8; font-size:20px; margin: 0 0 8px; }
  .empty p{ margin:0; font-size:14px; }

  .loading{ text-align:center; padding: 60px 0; color:#a79f8c; font-size:14px; }

  .overlay{ position:fixed; inset:0; background: rgba(10,10,14,0.6); display:none; align-items:center; justify-content:center; padding: 20px; z-index: 50; }
  .overlay.show{ display:flex; }
  .modal{ background: var(--card); color: var(--ink); width: 100%; max-width: 380px; border-radius: 16px; padding: 26px 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
  .modal h3{ font-family:"Noto Serif KR", serif; font-size: 20px; margin: 0 0 4px; }
  .modal .hint{ font-size:12.5px; color: var(--ink-soft); }
  .btn{ border:none; border-radius: 8px; padding: 12px 16px; font-size: 14px; font-weight:700; cursor:pointer; font-family: inherit; }
  .btn-ghost{ background:transparent; color: var(--ink-soft); }
  .btn-ghost:hover{ background: rgba(33,28,20,0.06); }
  .btn-primary{ background: var(--amber-deep); color:#fff8ea; }
  .btn-primary:hover{ background:#a06a19; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="marquee">
    <div>
      <h1>대학로 이벤트 카페</h1>
      <p id="taglineText">공연 배우 서포트 카페 일정을 한곳에 모아보세요</p>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="이벤트명, 배우명, 카페명 검색">
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="ongoing">진행중</button>
      <button class="tab" data-filter="upcoming">예정</button>
      <button class="tab" data-filter="ended">종료</button>
    </div>
    <button class="fav-toggle" id="favToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      즐겨찾기만
    </button>
  </div>

  <div class="date-filter-row">
    <select class="date-select" id="dateFilterSelect">
      <option value="all">전체 기간</option>
      <option value="today">오늘</option>
      <option value="thisWeek">이번 주</option>
      <option value="thisWeekend">이번 주말</option>
      <option value="nextWeek">다음 주</option>
      <option value="custom">날짜 선택</option>
    </select>
    <input type="date" class="custom-date-input" id="customDateInput" style="display:none;">
    <select class="date-select" id="sortModeSelect">
      <option value="date">날짜순</option>
      <option value="recent">최근 등록순</option>
    </select>
  </div>

  <div class="today-banner" id="todayBanner">
    <span>🔥</span><span id="todayBannerText"></span>
  </div>

  <div id="content">
    <div class="loading">불러오는 중…</div>
  </div>
</div>

<div class="fav-toast" id="favToast"></div>

<button class="report-fab" id="reportBtn" aria-label="제보하기" title="제보하기">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
</button>

<div class="overlay" id="reportOverlay">
  <div class="modal" style="max-width:360px;">
    <h3>제보하기</h3>
    <p class="hint" style="margin-top:-8px;">놓친 공지가 있다면 링크를 보내주세요. 관리자에게 바로 전달돼요.</p>
    <div class="field">
      <label>공지 링크</label>
      <input type="url" id="reportLinkInput" placeholder="https://x.com/...">
    </div>
    <div id="reportFeedback" style="font-size:12.5px; color:var(--ink-soft); margin:-6px 0 10px; min-height:16px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="reportCancelBtn">취소</button>
      <button type="button" class="btn btn-primary" id="reportConfirmBtn">확인</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal" style="max-width:420px; padding:0; overflow:hidden; position:relative;">
    <button type="button" class="fav-btn" id="detailFavoriteBtn" aria-label="즐겨찾기">
      <svg id="detailFavoriteIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2c069" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <div id="detailImageWrap"></div>
    <div style="padding:22px 24px 20px;">
      <span class="ticket-status" id="detailStatus"></span>
      <h2 id="detailEventName" style="font-family:'Noto Serif KR', serif; font-size:21px; margin:8px 0 2px;"></h2>
      <p id="detailCafeName" style="font-weight:700; color:var(--ink-soft); margin:0 0 10px; font-size:13.5px;"></p>
      <p class="actor" id="detailActor" style="margin:0 0 12px;"></p>
      <div id="detailMetaRows"></div>
      <div id="detailMemo"></div>
      <a id="detailLinkBtn" class="link-btn" href="#" target="_blank" rel="noopener noreferrer" style="justify-content:center; margin-top:14px;"></a>
      <button type="button" class="btn btn-ghost" id="detailCalendarBtn" style="width:100%; margin-top:10px; border:1px solid var(--line);">📅 캘린더에 저장</button>
      <button type="button" class="btn btn-ghost" id="detailCloseBtn" style="width:100%; margin-top:10px;">닫기</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_GnZQh7sLtIt85TZSeAuCB-hkoeTozI0",
  authDomain: "event-cafe-hyehwa.firebaseapp.com",
  projectId: "event-cafe-hyehwa",
  storageBucket: "event-cafe-hyehwa.firebasestorage.app",
  messagingSenderId: "47128695573",
  appId: "1:47128695573:web:c6e2bf2a395c05914a4f1c",
  measurementId: "G-PE84VHSE3H"
};

const fbApp = initializeApp(firebaseConfig);

/* ---------- EmailJS (제보하기) ----------
   emailjs.com 무료 가입 후 아래 세 값을 발급받은 값으로 바꿔주세요.
   설정 방법은 관리자에게 별도로 안내된 문서를 참고하세요. */
const EMAILJS_PUBLIC_KEY = 'YOUR_EMAILJS_PUBLIC_KEY';
const EMAILJS_SERVICE_ID = 'YOUR_EMAILJS_SERVICE_ID';
const EMAILJS_TEMPLATE_ID = 'YOUR_EMAILJS_TEMPLATE_ID';
if(window.emailjs){
  try{ window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); }catch(e){ console.error('emailjs 초기화 오류', e); }
}
const db = getFirestore(fbApp);
const eventsCol = collection(db, 'events');
const generalDocRef = doc(db, 'settings', 'general');

let events = [];
let currentFilter = 'ongoing';
let searchTerm = '';
let showFavoritesOnly = false;
let dateFilterMode = 'all';
let sortMode = 'date';
let customDateValue = '';
const contentEl = document.getElementById('content');
const detailOverlay = document.getElementById('detailOverlay');
const favToast = document.getElementById('favToast');

/* ---------- Favorites (local, per-device) ---------- */
function getFavorites(){
  try{ return JSON.parse(localStorage.getItem('favoriteActors') || '[]'); }
  catch(e){ return []; }
}
function saveFavorites(list){
  try{ localStorage.setItem('favoriteActors', JSON.stringify(list)); }catch(e){}
}
function isFavoriteActor(actor){
  return getFavorites().includes(actor);
}
function toggleFavoriteActor(actor){
  if(!actor) return;
  const list = getFavorites();
  const idx = list.indexOf(actor);
  if(idx > -1){ list.splice(idx, 1); }
  else{
    list.push(actor);
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }
  saveFavorites(list);
  return list.includes(actor);
}

/* ---------- New-event check for favorited actors ---------- */
function getLastCheckedAt(){
  const v = localStorage.getItem('favLastCheckedAt');
  return v ? Number(v) : null;
}
function setLastCheckedAt(ts){
  try{ localStorage.setItem('favLastCheckedAt', String(ts)); }catch(e){}
}
function showFavToast(message){
  favToast.innerHTML = message;
  favToast.classList.add('show');
  setTimeout(()=> favToast.classList.remove('show'), 5000);
}
function checkForNewFavoriteEvents(list){
  const lastChecked = getLastCheckedAt();
  const now = Date.now();
  if(lastChecked === null){
    // first ever visit: don't retroactively notify, just start the clock
    setLastCheckedAt(now);
    return;
  }
  const favorites = getFavorites();
  if(favorites.length === 0){ setLastCheckedAt(now); return; }
  const fresh = list.filter(ev => favorites.includes(ev.actor) && typeof ev.createdAt === 'number' && ev.createdAt > lastChecked);
  if(fresh.length > 0){
    if(fresh.length === 1){
      showFavToast(`⭐ <strong>${escapeHtml(fresh[0].actor)}</strong> 배우의 새 카페가 등록됐어요: ${escapeHtml(fresh[0].eventName || fresh[0].cafeName)}`);
    }else{
      showFavToast(`⭐ 즐겨찾기한 배우님들의 새 카페가 ${fresh.length}건 등록됐어요!`);
    }
    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification('대학로 이벤트 카페', {
          body: fresh.length === 1
            ? `${fresh[0].actor} 배우의 새 카페: ${fresh[0].eventName || fresh[0].cafeName}`
            : `즐겨찾기한 배우님들의 새 카페가 ${fresh.length}건 등록됐어요.`
        });
      }catch(e){}
    }
  }
  setLastCheckedAt(now);
}

onSnapshot(eventsCol, (snapshot)=>{
  events = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  checkForNewFavoriteEvents(events);
  updateTodayBanner();
  render();
}, (err)=>{
  console.error('불러오기 오류', err);
  contentEl.innerHTML = `<div class="empty"><h3>불러오기 실패</h3><p>잠시 후 다시 시도해주세요.</p></div>`;
});

document.getElementById('favToggle').addEventListener('click', ()=>{
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById('favToggle').classList.toggle('active', showFavoritesOnly);
  render();
});

const reportOverlay = document.getElementById('reportOverlay');

document.getElementById('reportBtn').addEventListener('click', ()=>{
  document.getElementById('reportLinkInput').value = '';
  document.getElementById('reportFeedback').textContent = '';
  document.getElementById('reportFeedback').style.color = 'var(--ink-soft)';
  reportOverlay.classList.add('show');
  setTimeout(()=> document.getElementById('reportLinkInput').focus(), 30);
});
function closeReportPopup(){ reportOverlay.classList.remove('show'); }
document.getElementById('reportCancelBtn').addEventListener('click', closeReportPopup);
reportOverlay.addEventListener('click', (e)=>{ if(e.target === reportOverlay) closeReportPopup(); });
document.getElementById('reportConfirmBtn').addEventListener('click', async ()=>{
  const feedback = document.getElementById('reportFeedback');
  let link = document.getElementById('reportLinkInput').value.trim();
  if(!link){
    feedback.style.color = 'var(--velvet)';
    feedback.textContent = '링크를 입력해주세요.';
    return;
  }
  if(!/^https?:\/\//i.test(link)) link = 'https://' + link;

  const btn = document.getElementById('reportConfirmBtn');
  btn.disabled = true;
  feedback.style.color = 'var(--ink-soft)';
  feedback.textContent = '전송 중…';
  try{
    if(!window.emailjs) throw new Error('emailjs not loaded');
    await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { link });
    feedback.style.color = 'var(--amber-deep)';
    feedback.textContent = '제보가 전달됐어요. 감사해요!';
    setTimeout(closeReportPopup, 1200);
  }catch(err){
    console.error('제보 전송 오류', err);
    feedback.style.color = 'var(--velvet)';
    feedback.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
  }finally{
    btn.disabled = false;
  }
});

getDoc(generalDocRef).then(snap => {
  const data = snap.exists() ? snap.data() : {};

document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ closeReportPopup(); closeDetail(); } });

function todayMidnight(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(str){ if(!str) return null; const d = new Date(str + 'T00:00:00'); return isNaN(d) ? null : d; }
function fmtDate(str){ const d = parseDate(str); if(!d) return ''; return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function fmtDateShort(str){ const d = parseDate(str); if(!d) return ''; return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function dateRangeLabel(ev){ if(!ev.endDate || ev.endDate === ev.startDate) return fmtDate(ev.startDate); return `${fmtDate(ev.startDate)} ~ ${fmtDate(ev.endDate)}`; }
function dateRangeLabelShort(ev){ if(!ev.endDate || ev.endDate === ev.startDate) return fmtDateShort(ev.startDate); return `${fmtDateShort(ev.startDate)} ~ ${fmtDateShort(ev.endDate)}`; }

function getWeekRange(offsetWeeks){
  const now = todayMidnight();
  const day = now.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday + offsetWeeks*7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { start: monday, end: sunday };
}
function getWeekendRange(offsetWeeks){
  const { start } = getWeekRange(offsetWeeks);
  const saturday = new Date(start); saturday.setDate(start.getDate()+5);
  const sunday = new Date(start); sunday.setDate(start.getDate()+6);
  return { start: saturday, end: sunday };
}
function matchesDateFilter(ev){
  if(dateFilterMode === 'all') return true;
  const start = parseDate(ev.startDate);
  const end = parseDate(ev.endDate) || start;
  if(!start) return false;
  let rangeStart, rangeEnd;
  if(dateFilterMode === 'today'){ rangeStart = rangeEnd = todayMidnight(); }
  else if(dateFilterMode === 'thisWeek'){ ({ start: rangeStart, end: rangeEnd } = getWeekRange(0)); }
  else if(dateFilterMode === 'thisWeekend'){ ({ start: rangeStart, end: rangeEnd } = getWeekendRange(0)); }
  else if(dateFilterMode === 'nextWeek'){ ({ start: rangeStart, end: rangeEnd } = getWeekRange(1)); }
  else if(dateFilterMode === 'custom'){
    const d = parseDate(customDateValue);
    if(!d) return true;
    rangeStart = rangeEnd = d;
  }else{ return true; }
  return start <= rangeEnd && end >= rangeStart;
}
function updateTodayBanner(){
  const count = events.filter(ev => computeStatus(ev).key === 'ongoing').length;
  const banner = document.getElementById('todayBanner');
  if(count > 0){
    document.getElementById('todayBannerText').textContent = `오늘 갈 수 있는 카페 ${count}개 보기`;
    banner.classList.add('show');
  }else{
    banner.classList.remove('show');
  }
}
document.getElementById('todayBanner').addEventListener('click', ()=>{
  dateFilterMode = 'today';
  document.getElementById('dateFilterSelect').value = 'today';
  document.getElementById('customDateInput').style.display = 'none';
  render();
});
document.getElementById('dateFilterSelect').addEventListener('change', (e)=>{
  dateFilterMode = e.target.value;
  document.getElementById('customDateInput').style.display = dateFilterMode === 'custom' ? '' : 'none';
  if(dateFilterMode === 'custom' && !customDateValue){
    customDateValue = document.getElementById('customDateInput').value;
  }
  render();
});
document.getElementById('customDateInput').addEventListener('change', (e)=>{
  customDateValue = e.target.value;
  render();
});
document.getElementById('sortModeSelect').addEventListener('change', (e)=>{
  sortMode = e.target.value;
  render();
});
function computeStatus(ev){
  const today = todayMidnight();
  const start = parseDate(ev.startDate);
  const end = parseDate(ev.endDate) || start;
  if(!start) return { key:'upcoming', label:'예정' };
  if(end < today) return { key:'ended', label:'종료' };
  if(start <= today && today <= end) return { key:'ongoing', label:'진행중' };
  const diff = Math.ceil((start - today) / (1000*60*60*24));
  return { key:'upcoming', label: `D-${diff}` };
}
function iconCalendar(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`; }
function iconClock(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>`; }
function iconPin(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`; }
function iconExternal(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`; }
function iconPhoto(){ return `<svg class="placeholder-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>`; }
function iconStar(filled){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="${filled ? '#f2c069' : 'none'}" stroke="#f2c069" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`; }
function escapeHtml(str){ return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function escapeAttr(str){ return escapeHtml(str); }

function getFiltered(){
  let list = events.map(ev => ({ ev, status: computeStatus(ev) }));
  if(currentFilter === 'ongoing') list = list.filter(x => x.status.key === 'ongoing');
  else if(currentFilter === 'upcoming') list = list.filter(x => x.status.key === 'upcoming');
  else if(currentFilter === 'ended') list = list.filter(x => x.status.key === 'ended');
  if(showFavoritesOnly){
    const favorites = getFavorites();
    list = list.filter(x => favorites.includes(x.ev.actor));
  }
  list = list.filter(x => matchesDateFilter(x.ev));
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(x => (x.ev.eventName || '').toLowerCase().includes(q) || (x.ev.actor || '').toLowerCase().includes(q) || (x.ev.cafeName || '').toLowerCase().includes(q));
  }
  if(sortMode === 'recent'){
    list.sort((a,b) => (b.ev.createdAt||0) - (a.ev.createdAt||0));
  }else{
    const rank = { ongoing:0, upcoming:1, ended:2 };
    list.sort((a,b)=>{
      if(rank[a.status.key] !== rank[b.status.key]) return rank[a.status.key]-rank[b.status.key];
      const da = parseDate(a.ev.startDate) || 0;
      const db_ = parseDate(b.ev.startDate) || 0;
      if(a.status.key === 'ended') return db_ - da;
      return da - db_;
    });
  }
  return list;
}

function render(){
  const list = getFiltered();
  if(events.length === 0){
    contentEl.innerHTML = `<div class="empty"><h3>아직 등록된 이벤트 카페가 없어요</h3><p>새로운 소식이 올라오면 여기에 표시돼요.</p></div>`;
    return;
  }
  if(list.length === 0){
    contentEl.innerHTML = `<div class="empty"><h3>조건에 맞는 카페가 없어요</h3><p>검색어나 필터를 바꿔보세요.</p></div>`;
    return;
  }
  contentEl.innerHTML = `<div class="grid">${list.map(({ev, status}) => `
    <div class="ticket" data-id="${ev.id}">
      <div class="ticket-image">
        ${ev.imageData ? `<img src="${ev.imageData}" alt="">` : iconPhoto()}
        ${isFavoriteActor(ev.actor) ? `<div class="card-fav-badge">${iconStar(true)}</div>` : ''}
      </div>
      <div class="ticket-body-compact">
        <span class="ticket-status status-${status.key}">${status.label}</span><span class="card-date-text">${dateRangeLabelShort(ev)}</span>
        <h2>${escapeHtml(ev.eventName || ev.cafeName)}</h2>
      </div>
    </div>
  `).join('')}</div>`;

  contentEl.querySelectorAll('.ticket').forEach(card => card.addEventListener('click', ()=> openDetail(card.dataset.id)));
}

/* ---------- Detail view ---------- */
let currentDetailActor = '';
let currentDetailEvent = null;
function openDetail(id){
  const ev = events.find(e => e.id === id);
  if(!ev) return;
  currentDetailActor = ev.actor;
  currentDetailEvent = ev;
  const status = computeStatus(ev);
  document.getElementById('detailImageWrap').innerHTML = ev.imageData ? `<img src="${ev.imageData}" style="width:100%; display:block; max-height:260px; object-fit:cover;">` : '';
  updateFavoriteButton();
  const statusEl = document.getElementById('detailStatus');
  statusEl.textContent = status.label;
  statusEl.className = `ticket-status status-${status.key}`;
  document.getElementById('detailEventName').textContent = ev.eventName || ev.cafeName;
  document.getElementById('detailCafeName').textContent = ev.cafeName;
  document.getElementById('detailActor').textContent = ev.actor;
  const rows = [];
  if(ev.place) rows.push(`<div class="meta-row">${iconPin()}<span>${escapeHtml(ev.place)}</span></div>`);
  rows.push(`<div class="meta-row">${iconCalendar()}<span>${dateRangeLabel(ev)}</span></div>`);
  if(ev.time) rows.push(`<div class="meta-row">${iconClock()}<span>${escapeHtml(ev.time)}</span></div>`);
  document.getElementById('detailMetaRows').innerHTML = rows.join('');
  document.getElementById('detailMemo').innerHTML = ev.memo ? `<div class="memo">${escapeHtml(ev.memo)}</div>` : '';
  const linkBtn = document.getElementById('detailLinkBtn');
  if(ev.link){
    linkBtn.href = ev.link;
    linkBtn.innerHTML = `${iconExternal()} 공지 보기`;
    linkBtn.style.display = 'inline-flex';
  }else{
    linkBtn.style.display = 'none';
  }
  detailOverlay.classList.add('show');
}
function updateFavoriteButton(){
  const fav = isFavoriteActor(currentDetailActor);
  document.getElementById('detailFavoriteIcon').setAttribute('fill', fav ? '#f2c069' : 'none');
}
document.getElementById('detailFavoriteBtn').addEventListener('click', ()=>{
  toggleFavoriteActor(currentDetailActor);
  updateFavoriteButton();
  render();
});
function closeDetail(){ detailOverlay.classList.remove('show'); }
function escapeICS(str){
  return String(str ?? '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function compactDate(dateObj){
  return `${dateObj.getFullYear()}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}`;
}
function downloadICS(ev){
  const start = parseDate(ev.startDate);
  const end = parseDate(ev.endDate) || start;
  if(!start) return;
  const endExclusive = new Date(end); endExclusive.setDate(endExclusive.getDate()+1);
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${String(now.getUTCMonth()+1).padStart(2,'0')}${String(now.getUTCDate()).padStart(2,'0')}T${String(now.getUTCHours()).padStart(2,'0')}${String(now.getUTCMinutes()).padStart(2,'0')}${String(now.getUTCSeconds()).padStart(2,'0')}Z`;
  const descParts = [];
  if(ev.cafeName) descParts.push(`카페: ${ev.cafeName}`);
  if(ev.actor) descParts.push(`배우: ${ev.actor}`);
  if(ev.time) descParts.push(`시간: ${ev.time}`);
  if(ev.memo) descParts.push(ev.memo);
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//daehakro-event-cafe//KR',
    'BEGIN:VEVENT',
    `UID:${ev.id}@daehakro-event-cafe`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${compactDate(start)}`,
    `DTEND;VALUE=DATE:${compactDate(endExclusive)}`,
    `SUMMARY:${escapeICS(ev.eventName || ev.cafeName)}`,
    ev.place ? `LOCATION:${escapeICS(ev.place)}` : '',
    `DESCRIPTION:${descParts.map(escapeICS).join('\\n')}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `daehakro-cafe-${ev.startDate || 'event'}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
document.getElementById('detailCalendarBtn').addEventListener('click', ()=>{
  if(currentDetailEvent) downloadICS(currentDetailEvent);
});
document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);
detailOverlay.addEventListener('click', (e)=>{ if(e.target === detailOverlay) closeDetail(); });

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  render();
});
document.getElementById('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
